name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: zapret-manager-windows
          path: |
            release/Zapret-Manager-Setup.exe
            release/Zapret-Manager-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "release/Zapret-Manager-Setup.exe#Windows x64 installer" "release/Zapret-Manager-Setup.exe.blockmap" "release/latest.yml" --verify-tag --generate-notes --title "Zapret Manager $env:GITHUB_REF_NAME"
